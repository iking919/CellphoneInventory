<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cellphone Inventory Manager</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- Nav bar for routing across pages-->
    <header id="top">
        <img src="assets/smartphone-svgrepo-com.svg" class="header-icon header-icon-left">
        <h1>Cellphone Inventory Manager</h1>
        <nav>
            <a href="index.html">Full Inventory</a>
            <a href="inventory-search.html">Inventory Search</a>
            <a href="add-inventory.html">Add Inventory</a>
            <a href="remove-inventory.html" class="active">Remove Inventory</a>
        </nav>
        <img src="assets/search-svgrepo-com.svg" class="header-icon header-icon-right">
    </header>


    <!-- Display inventory table, with functionality to delete inventory accordingly -->
    <main>
        <h2>Remove Inventory</h2>
        <p>Select an existing phone to remove from inventory.</p>
        <p id="inventory-status" role="status">Loading inventory...</p>
        <div class="table-container">
            <table id="inventory-table" data-allow-delete="true">
                <thead>
                    <tr>
                        <th scope="col">Brand</th>
                        <th scope="col">Model</th>
                        <th scope="col">Storage</th>
                        <th scope="col">Color</th>
                        <th scope="col">Price</th>
                        <th scope="col">Action</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </main>

    <!-- Delete confirmation pop-up whn a delete is attempted -->
    <dialog id="delete-confirmation">
        <h2 id="delete-confirmation-title">Confirm deletion</h2>
        <p id="delete-confirmation-message">Are you sure you want to delete this phone?</p>
        <form method="dialog" class="confirmation-actions">
            <button type="submit" value="cancel" autofocus>No</button>
            <button type="submit" value="confirm" id="confirm-delete">Yes</button>
        </form>
    </dialog>
    <script src="js/inventory.js" defer></script>
    <script src="js/delete-phone.js" defer></script>
</body>
</html>
