<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cellphone Inventory Manager</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- Navigation links to the application's main pages -->
    <header id="top">
        <img src="assets/smartphone-svgrepo-com.svg" class="header-icon header-icon-left">
        <h1>Cellphone Inventory Manager</h1>
        <nav>
            <a href="index.html">Full Inventory</a>
            <a href="inventory-search.html">Inventory Search</a>
            <a href="add-inventory.html">Add Inventory</a>
            <a href="manage-inventory.html" class="active">Manage Inventory</a>
        </nav>
    </header>

    <!-- Inventory table containing edit and delete controls -->
    <main>
        <h2>Manage Inventory</h2>
        <p>Select an existing phone to manage in inventory.</p>

        <!-- Inventory status displays loading or update messages. -->
        <p id="inventory-status" role="status">Loading inventory...</p>

        <!-- Inventory table populated dynamically by inventory.js -->
        <div class="table-container">
            <table id="inventory-table" data-allow-edit="true" data-load-inventory="true">
                <thead>
                    <tr>
                        <th scope="col" aria-sort="none"><button type="button" class="sort-button" data-sort="brand">Brand <span class="sort-indicator" aria-hidden="true">&#8597;</span></button></th>
                        <th scope="col" aria-sort="none"><button type="button" class="sort-button" data-sort="model">Model <span class="sort-indicator" aria-hidden="true">&#8597;</span></button></th>
                        <th scope="col" aria-sort="none"><button type="button" class="sort-button" data-sort="storage">Storage <span class="sort-indicator" aria-hidden="true">&#8597;</span></button></th>
                        <th scope="col" aria-sort="none"><button type="button" class="sort-button" data-sort="color">Color <span class="sort-indicator" aria-hidden="true">&#8597;</span></button></th>
                        <th scope="col" aria-sort="none"><button type="button" class="sort-button" data-sort="price">Price <span class="sort-indicator" aria-hidden="true">&#8597;</span></button></th>
                        <th scope="col">Edit</th>
                        <th scope="col">Delete</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </main>

    <!-- Edit Phone confirmation dialog -->
    <dialog id="edit-confirmation">
        <h2>Edit phone</h2>

        <!-- Edit status displays validation or submission errors. -->
        <p id="edit-phone-status" class="form-status" role="alert"></p>

        <!-- Edit Phone form containing the five phone attributes -->
        <form id="edit-phone-form" novalidate>
            <div class="edit-phone-fields">
                <!-- Brand text field -->
                <div class="filter-group">
                    <label for="edit-brand">Brand</label>
                    <input type="text" id="edit-brand" name="brand" required>
                </div>

                <!-- Model text field -->
                <div class="filter-group">
                    <label for="edit-model">Model</label>
                    <input type="text" id="edit-model" name="model" required>
                </div>

                <!-- Storage text field -->
                <div class="filter-group">
                    <label for="edit-storage">Storage</label>
                    <input type="text" id="edit-storage" name="storage" required>
                </div>

                <!-- Color text field -->
                <div class="filter-group">
                    <label for="edit-color">Color</label>
                    <input type="text" id="edit-color" name="color" required>
                </div>

                <!-- Price field with a dollar sign prefix -->
                <div class="filter-group">
                    <label for="edit-price">Price</label>
                    <div class="currency-input">
                        <span>$</span>
                        <input type="number" id="edit-price" name="price"
                               inputmode="decimal" min="0.01" step="0.01" required>
                    </div>
                </div>
            </div>

            <!-- Edit dialog action buttons -->
            <div class="confirmation-actions">
                <button type="button" id="cancel-edit" value="cancel">Cancel</button>
                <button type="submit" id="save-edit">Save</button>
            </div>
        </form>
    </dialog>

    <!-- Confirmation dialog for deleting a phone -->
    <dialog id="delete-confirmation">
        <h2 id="delete-confirmation-title">Confirm deletion</h2>
        <p id="delete-confirmation-message">Are you sure you want to delete this phone?</p>
        <form id="delete-form" class="confirmation-actions" novalidate>
            <button type="button" id="cancel-delete" value="cancel" >No</button>
            <button type="submit" id="confirm-delete">Yes</button>
        </form>
    </dialog>
    <script src="js/inventory.js" defer></script>
    <script src="js/delete-phone.js" defer></script>
    <script src="js/edit-phone.js" defer></script>
</body>
</html>
